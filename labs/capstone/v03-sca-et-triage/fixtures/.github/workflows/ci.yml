name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests de notes-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Les deux portes de sécurité passent avant tout le reste : un secret ou
      # une injection ne doivent pas attendre la fin des tests pour arrêter la
      # branche. Images épinglées par digest, relevé le 2026-10-03.
      - name: Chercher les secrets
        uses: docker://zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir . --redact --exit-code 1

      - name: Analyse statique du code
        uses: docker://semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
        with:
          args: semgrep scan --config p/python --error --metrics=off .

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Installer les dépendances verrouillées
        run: uv sync --locked

      - name: Vérifier le modèle de menace
        run: uv run python scripts/check_threat_model.py threat-model.yml

      - name: Lancer les tests
        run: uv run pytest
