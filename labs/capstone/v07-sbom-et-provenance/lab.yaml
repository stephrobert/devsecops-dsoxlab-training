# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: capstone-v07-sbom-et-provenance
title: "V7, SBOM and provenance: know what ships, prove where it comes from"
description: |
  notes-api publishes an archive that nobody can trace: no inventory of what
  the image carries, no proof of which pipeline built it. Produce the SBOM of
  the built image and confront it with uv.lock using the team's tool, so that
  a package installed outside the lock turns the pipeline red; attest the
  provenance of the published archive from the deploy job; and write the
  check that refuses to deploy an archive not built by ci.yml from main.
section: capstone
level: capstone
difficulty: intermediate
lab_type: lab
estimated_time: 55m
skills:
  - sbom
  - cyclonedx
  - slsa-provenance
  - sigstore
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/securiser/supply-chain/attestations/slsa-provenance-decision/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ est la solution de V6, plus l'outil de l'équipe qui
  # confronte un SBOM CycloneDX au verrou.
  fixtures:
    - .actrc
    - .gitignore
    - .python-version
    - .github/workflows/ci.yml
    - .github/workflows/pr-welcome.yml
    - .github/CODEOWNERS
    - README.md
    - pyproject.toml
    - uv.lock
    - threat-model.yml
    - scripts/check_threat_model.py
    - scripts/check_sbom.py
    - src/notes_api/__init__.py
    - src/notes_api/app.py
    - tests/test_app.py
    - Dockerfile
    - infra/main.tf
    - infra/deploy.tf
    - infra/github-oidc-trust.json
    - osv-scanner.toml
validation:
  functional: true
  security: true
  persistence_after_reboot: false
