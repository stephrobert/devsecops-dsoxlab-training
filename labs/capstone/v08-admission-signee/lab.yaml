# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: capstone-v08-admission-signee
title: "V8, admission: the cluster refuses what the platform did not sign"
description: |
  notes-api now runs in a Kubernetes cluster, and the cluster starts any image
  a manifest names. Write the Kyverno admission policies of the notes-api
  namespace: only images from the internal registry, signed with the platform
  key, are admitted; an unsigned image, an image signed with another key, or
  an image from another registry is refused, a Deployment included, without
  blocking the rest of the cluster.
section: capstone
level: capstone
difficulty: advanced
lab_type: lab
estimated_time: 50m
skills:
  - kyverno
  - admission-control
  - cosign
  - kubernetes
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/devops/implementation/projets-fil-rouge-devsecops/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ est la solution de V7, plus la clé publique de la
  # plateforme et le contexte de déploiement dans le README du projet.
  fixtures:
    - .actrc
    - .gitignore
    - .python-version
    - .github/workflows/ci.yml
    - .github/workflows/pr-welcome.yml
    - .github/CODEOWNERS
    - README.md
    - pyproject.toml
    - uv.lock
    - threat-model.yml
    - scripts/check_threat_model.py
    - scripts/check_sbom.py
    - scripts/verify_release.sh
    - src/notes_api/__init__.py
    - src/notes_api/app.py
    - tests/test_app.py
    - Dockerfile
    - infra/main.tf
    - deploy/signing/cosign.pub
    - infra/deploy.tf
    - infra/github-oidc-trust.json
    - osv-scanner.toml
validation:
  functional: true
  security: true
  persistence_after_reboot: false
