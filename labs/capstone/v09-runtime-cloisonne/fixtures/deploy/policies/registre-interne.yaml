# Dans l'espace de noms notes-api, toute image vient du registre interne. Sans
# cette politique, une image de Docker Hub échapperait à la vérification de
# signature, qui ne regarde que les images du registre interne.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: notes-api-registre-interne
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: notes-api
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.startsWith('registry.notes.internal:5000/'))
        && (!has(object.spec.initContainers)
            || object.spec.initContainers.all(c, c.image.startsWith('registry.notes.internal:5000/')))
      message: "notes-api ne tire ses images que du registre interne registry.notes.internal:5000."
