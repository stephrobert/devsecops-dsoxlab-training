apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes-api
  labels:
    app: notes-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: notes-api
          image: registry.notes.internal:5000/notes-api:1.0.0
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
